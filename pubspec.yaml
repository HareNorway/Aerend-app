  flutter_html: ^3.0.0-beta.2
  google_fonts: ^6.2.1
  translator: ^1.0.4+1
  flutter_image_compress: ^2.3.0
  carousel_slider: ^5.0.0
  showcaseview: ^3.0.0
  liquid_swipe: ^3.0.0
  cached_network_image: ^3.2.3
  readmore: ^3.0.0
  step_progress_indicator: any
  json_annotation: ^4.9.0
