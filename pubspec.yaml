  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/aegil/
    - assets/images/dashboard/
    - assets/images/products/
    - assets/images/service-category/
    - assets/gifs/
    - assets/svgs/
    - assets/svgs/icons/
    - assets/svgs/onboarding/
    - assets/svgs/dashboard/
    - assets/svgs/star/
    - assets/svgs/delivery/
    - assets/svgs/account/
    - assets/svgs/menu/
    - assets/svgs/categories/
    - assets/svgs/services/
    - assets/Logo/
    - assets/Logo/reen/mark-coral-navy.png
    - assets/mapStyle/
    - assets/flags/
    - assets/json/

  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/CustomIcons.ttf
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: icon/aerend_app_icon.png
  remove_alpha_ios: true
  android_adaptive_icon_background: "#173E48"
  android_adaptive_icon_foreground: "icon/aerend_app_icon_fg.png"
  min_sdk_android: 21
